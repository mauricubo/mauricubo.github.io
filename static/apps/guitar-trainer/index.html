<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MauriFret — Guitar Scales & Improvisation</title>
  <meta name="description" content="Interactive guitar scale explorer, fretboard and ear training, sequence drills, backing tracks with chord-scale guidance and a 12-week study plan from intermediate to advanced.">
  <meta name="theme-color" content="#0e1014">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f5a524'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' fill='none' stroke='%231a1206' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='16' cy='17' r='3.4' fill='%231a1206'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button class="brand" type="button" aria-label="MauriFret home">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="28" height="28"><rect width="32" height="32" rx="8" class="logo-bg"/><path d="M8 23V9l8 8 8-8v14" class="logo-str"/><circle cx="8" cy="9" r="2.6" class="logo-dot"/><circle cx="16" cy="17" r="3.2" class="logo-dot"/><circle cx="24" cy="9" r="2.6" class="logo-dot"/></svg>
        </span>
        <span class="brand-name">MauriFret</span>
      </button>

      <nav class="tabs" id="tabs" aria-label="Sections">
        <button data-view="explore">Explore</button>
        <button data-view="practice">Practice</button>
        <button data-view="improvise">Improvise</button>
        <button data-view="analyze">Analyzer</button>
        <button data-view="plan">Study Plan</button>
        <button data-view="theory">Theory</button>
      </nav>

      <div class="top-actions">
        <div class="metro" title="Metronome">
          <button class="icon-btn" id="metroToggle" aria-label="Start/stop metronome">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 3h6l4 18H5L9 3z M12 16l5-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
          </button>
          <span class="metro-led" id="metroLed"></span>
          <button class="mini" id="metroDown" aria-label="Slower">−</button>
          <input id="metroBpm" type="number" min="30" max="260" aria-label="Metronome BPM">
          <button class="mini" id="metroUp" aria-label="Faster">+</button>
          <button class="mini tap" id="metroTap">Tap</button>
        </div>
        <label class="vol" title="Volume">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9h4l5-4v14l-5-4H4z M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
          <input type="range" id="volume" min="0" max="1" step="0.05" aria-label="Volume">
        </label>
        <button class="icon-btn" id="themeToggle" aria-label="Toggle light/dark theme">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="view" id="view-explore"></section>
    <section class="view" id="view-practice"></section>
    <section class="view" id="view-improvise"></section>
    <section class="view" id="view-analyze"></section>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-theory"></section>
  </main>

  <footer class="footer">
    <p>MauriFret · built with plain HTML, CSS &amp; JavaScript · audio synthesized live with the Web Audio API. Your progress is saved in this browser.</p>
  </footer>

  <noscript><p class="noscript">MauriFret needs JavaScript to run.</p></noscript>

  <script src="js/theory.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/app.js"></script>
  <script src="js/explore.js"></script>
  <script src="js/practice.js"></script>
  <script src="js/improv.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/analyzer.js"></script>
</body>
</html>
