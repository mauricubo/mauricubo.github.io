# ---------------------------------------------------------------------------
# Music page content
#
# TRACKS: drop your audio files (mp3, m4a, ogg, wav...) in `static/music/`
# and list them here. `file` can also be a full https:// URL to a file hosted
# elsewhere (e.g. Cloudflare R2, Backblaze, archive.org).
# ---------------------------------------------------------------------------
tracks:
  - title: "Demo arpeggio in C (replace me)"
    file: "/music/demo-1.mp3"
    description: "A generated placeholder so you can see the player working."
    # artist: "Mauricio A."              # optional, defaults to the site author
    # cover: "/images/music/cover.jpg"   # optional square image
    # duration: "3:41"                   # optional, detected automatically when played
    download: true                        # show a download button

  - title: "Demo arpeggio in D minor (replace me)"
    file: "/music/demo-2.mp3"
    description: "Another placeholder track."

