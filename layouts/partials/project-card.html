<article class="card project-card">
  <a class="card-media" href="{{ .RelPermalink }}" tabindex="-1" aria-hidden="true">
    {{- with .Params.cover }}
    <img src="{{ . | relURL }}" alt="" loading="lazy">
    {{- else }}
    <span class="card-placeholder">{{ substr .Title 0 1 }}</span>
    {{- end }}
  </a>
  <div class="card-body">
    <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    {{ with .Description }}<p class="card-text">{{ . }}</p>{{ end }}
    {{ with .Params.stack }}<ul class="chips">{{ range . }}<li>{{ . }}</li>{{ end }}</ul>{{ end }}
  </div>
</article>
