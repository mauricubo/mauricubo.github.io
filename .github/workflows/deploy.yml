# Builds the site with Hugo and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Blocks the deploy if a secret or a personal file would be published.
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # a secret removed in a later commit is still public in the history, so scan all of it
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          curl -sSfL -o "${{ runner.temp }}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${{ runner.temp }}/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "${{ runner.temp }}/gitleaks.tar.gz" -C "${{ runner.temp }}" gitleaks

      - name: Scan the git history for secrets
        run: ${{ runner.temp }}/gitleaks git --redact --verbose --exit-code 1 .

      - name: Block personal documents and key files
        run: |
          bad="$(git ls-files | grep -Ei '\.(docx|env|pem|key|p12|pfx)$|_data\.json$|(^|/)id_(rsa|ed25519)|(^|/)\.env(\.|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::These files must not be published:"
            echo "$bad"
            exit 1
          fi
          echo "No personal documents or key files found."

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.162.1
    steps:
      - name: Install Hugo
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
